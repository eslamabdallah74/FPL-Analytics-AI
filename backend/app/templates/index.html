<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL AI - Connect Your FPL Account</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(22, 30, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #38ef7d;
            --primary-glow: rgba(56, 239, 125, 0.3);
            --accent: #11998e;
            --purple: #8b5cf6;
            --warning: #f59e0b;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(17, 153, 142, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(56, 239, 125, 0.06) 0px, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .hero-container {
            max-width: 540px;
            width: 100%;
            text-align: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 239, 125, 0.1);
            border: 1px solid rgba(56, 239, 125, 0.3);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 400;
            line-height: 1.6;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-connect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #04120a;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 1.15rem;
            padding: 1.1rem 2rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 25px var(--primary-glow);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--primary-glow);
            opacity: 0.98;
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: left;
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
            background: rgba(15, 23, 42, 0.98);
        }

        .btn-modal-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #04120a;
            font-weight: 800;
            font-size: 1rem;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .btn-modal-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 25px var(--primary-glow);
        }

        .btn-modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 0.75rem;
            width: 100%;
            text-align: center;
        }

        .security-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            line-height: 1.5;
        }

        .error-banner {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="brand-badge">
            <span>⚡ FPL AI INTEGRATION</span>
        </div>

        <h1>FPL AI</h1>
        <p class="subtitle">Connect your FPL account to analyze your team with AI.</p>

        <div id="errorBanner" class="error-banner"></div>

        <div class="card">
            <!-- Primary Action: Connect FPL -->
            <button onclick="handleConnectFPL()" class="btn-connect">
                <span>⚽ Connect FPL</span>
            </button>

            <div class="security-note">
                🔒 Direct Authentication Integration.<br>
                <em>Authenticates directly against Premier League servers.</em>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div id="connectModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Sign In to Your FPL Account</div>
            <div class="modal-desc">
                Sign in with your <strong>FPL Account Email & Password</strong> to automatically connect your squad:
            </div>

            <!-- Tab Switcher inside Modal -->
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem;">
                <button id="tabEmailBtn" onclick="switchModalTab('email')" style="flex: 1; padding: 0.55rem; border-radius: 10px; border: 1px solid var(--primary); background: rgba(56, 239, 125, 0.12); color: var(--primary); font-weight: 700; cursor: pointer; font-size: 0.82rem;">
                    📧 Email & Password
                </button>
                <button id="tabTokenBtn" onclick="switchModalTab('token')" style="flex: 1; padding: 0.55rem; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.82rem;">
                    🔑 Session Token
                </button>
                <button id="tabIdBtn" onclick="switchModalTab('id')" style="flex: 1; padding: 0.55rem; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; font-size: 0.82rem;">
                    🆔 Manager ID
                </button>
            </div>

            <!-- Form 1: Email & Password -->
            <div id="formEmail">
                <div class="form-group">
                    <label for="inputFplEmail">FPL Account Email</label>
                    <input type="text" id="inputFplEmail" value="beromara128@gmail.com" placeholder="your_email@example.com">
                </div>
                <div class="form-group">
                    <label for="inputFplPassword">FPL Password</label>
                    <input type="password" id="inputFplPassword" value="Eslam1020#" placeholder="••••••••">
                </div>
                <button onclick="submitConnectEmail()" class="btn-modal-primary">Sign In & Connect Squad</button>
            </div>

            <!-- Form 2: Session Token -->
            <div id="formToken" style="display: none;">
                <div class="form-group">
                    <label for="inputFplToken">FPL Session Cookie or Bearer Token</label>
                    <input type="text" id="inputFplToken" placeholder="Paste pl_profile cookie or JWT token">
                </div>
                <button onclick="submitConnectToken()" class="btn-modal-primary">Connect via Session Token</button>
            </div>

            <!-- Form 3: Manager ID -->
            <div id="formId" style="display: none;">
                <div class="form-group">
                    <label for="inputManagerId">FPL Manager ID (Entry ID)</label>
                    <input type="number" id="inputManagerId" placeholder="e.g. 1" value="1">
                </div>
                <button onclick="submitConnectManager()" class="btn-modal-primary">Connect Squad via ID</button>
            </div>

            <button onclick="closeModal()" class="btn-modal-close">Cancel</button>
        </div>
    </div>


    <script>
        // Check URL parameters for status/error
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const error = urlParams.get('error');

        if (error) {
            const errBanner = document.getElementById('errorBanner');
            errBanner.style.display = 'block';
            errBanner.textContent = `Unable to connect: ${error}`;
        }

        async function handleConnectFPL() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                
                if (data.connected) {
                    window.location.href = '/dashboard';
                    return;
                }

                if (data.client_configured) {
                    window.location.href = '/auth/fpl/login';
                } else {
                    document.getElementById('connectModal').style.display = 'flex';
                }
            } catch (e) {
                document.getElementById('connectModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('connectModal').style.display = 'none';
        }

        function switchModalTab(tab) {
            const formEmail = document.getElementById('formEmail');
            const formToken = document.getElementById('formToken');
            const formId = document.getElementById('formId');
            
            const tabEmailBtn = document.getElementById('tabEmailBtn');
            const tabTokenBtn = document.getElementById('tabTokenBtn');
            const tabIdBtn = document.getElementById('tabIdBtn');

            [tabEmailBtn, tabTokenBtn, tabIdBtn].forEach(b => {
                b.style.border = '1px solid var(--border-color)';
                b.style.background = 'transparent';
                b.style.color = 'var(--text-muted)';
            });

            formEmail.style.display = 'none';
            formToken.style.display = 'none';
            formId.style.display = 'none';

            if (tab === 'email') {
                formEmail.style.display = 'block';
                tabEmailBtn.style.border = '1px solid var(--primary)';
                tabEmailBtn.style.background = 'rgba(56, 239, 125, 0.1)';
                tabEmailBtn.style.color = 'var(--primary)';
            } else if (tab === 'token') {
                formToken.style.display = 'block';
                tabTokenBtn.style.border = '1px solid var(--primary)';
                tabTokenBtn.style.background = 'rgba(56, 239, 125, 0.1)';
                tabTokenBtn.style.color = 'var(--primary)';
            } else {
                formId.style.display = 'block';
                tabIdBtn.style.border = '1px solid var(--primary)';
                tabIdBtn.style.background = 'rgba(56, 239, 125, 0.1)';
                tabIdBtn.style.color = 'var(--primary)';
            }
        }

        async function submitConnectEmail() {
            const email = document.getElementById('inputFplEmail').value.trim();
            const password = document.getElementById('inputFplPassword').value.trim();

            if (!email || !password) {
                alert('Please enter your FPL Email and Password.');
                return;
            }

            try {
                const res = await fetch('/auth/fpl/connect-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    let errDetail = 'FPL authentication failed.';
                    try {
                        const err = await res.json();
                        errDetail = err.detail || errDetail;
                    } catch(e) {
                        errDetail = await res.text() || res.statusText;
                    }
                    alert('Authentication failed: ' + errDetail);
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            }
        }

        async function submitConnectToken() {
            const token = document.getElementById('inputFplToken').value.trim();
            if (!token) {
                alert('Please enter a valid FPL Session Cookie or Bearer Token');
                return;
            }

            try {
                const res = await fetch('/auth/fpl/connect-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    let errDetail = 'Token authentication failed.';
                    try {
                        const err = await res.json();
                        errDetail = err.detail || errDetail;
                    } catch(e) {
                        errDetail = await res.text() || res.statusText;
                    }
                    alert('Token connection failed: ' + errDetail);
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            }
        }

        async function submitConnectManager() {
            const managerId = document.getElementById('inputManagerId').value.trim();
            if (!managerId) {
                alert('Please enter a valid FPL Manager ID');
                return;
            }

            try {
                const res = await fetch('/auth/fpl/connect-manager', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ manager_id: parseInt(managerId) })
                });

                if (res.ok) {
                    window.location.href = '/dashboard';
                } else {
                    let errDetail = 'Failed to connect manager ID.';
                    try {
                        const err = await res.json();
                        errDetail = err.detail || errDetail;
                    } catch(e) {
                        errDetail = await res.text() || res.statusText;
                    }
                    alert('Connection failed: ' + errDetail);
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            }
        }

        // Automatically open modal if redirected with status=unconfigured_client or prompt=manager_id
        if (status === 'unconfigured_client' || status === 'prompt_manager_id') {
            document.getElementById('connectModal').style.display = 'flex';
        }
    </script>
</body>
</html>
